server:
  port: 8083

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: service-a
          uri: http://localhost:8091
          predicates:
            - Path=/api/**
          filters:
            - StripPrefix=1

        - id: annonce
          uri: http://localhost:8017
          predicates:
            - Path=/annonce/**
          filters:
            - StripPrefix=1

        - id: commande
          uri: http://localhost:8089
          predicates:
            - Path=/commande/**
          filters:
            - StripPrefix=1

        - id: user
          uri: http://localhost:8088
          predicates:
            - Path=/user/**
          filters:
            - StripPrefix=1

        - id: notification
          uri: ws://localhost:8091  # Assurez-vous d'utiliser `ws://` pour WebSocket
          predicates:
            - Path=/ws/**
          filters:
            - StripPrefix=1
            - AddRequestHeader=Upgrade, websocket  # Ajoutez cet en-tête pour forcer l'upgrade
            - AddRequestHeader=Connection, Upgrade

        - id: service-b
          uri: http://localhost:8082
          predicates:
            - Path=/apir/**
          filters:
            - name: AddRequestHeader
              args:
                name: X-Request-Foo
                value: Bar



  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/malek
          jwk-set-uri: http://localhost:8180/realms/malek/protocol/openid-connect/certs

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.cloud.gateway: DEBUG
