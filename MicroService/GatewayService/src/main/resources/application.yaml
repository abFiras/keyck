server:
  port: 8083

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:

        - id: service-a
          uri: http://localhost:8091
          predicates:
            - Path=/api/**
          filters:
            - StripPrefix=1  # Supprime "/annonce" avant de rediriger

        - id: annonce
          uri: http://localhost:8017
          predicates:
            - Path=/annonce/**
          filters:
            - StripPrefix=1  # Supprime "/annonce" avant de rediriger

        - id: commande
          uri: http://localhost:8089
          predicates:
            - Path=/commande/**
          filters:
            - StripPrefix=1  # Supprime "/annonce" avant de rediriger

        - id: user
          uri: lb://user
          predicates:
            - Path=/user/**
          filters:
            - StripPrefix=1  # Supprime "/annonce" avant de rediriger

        - id: notification
          uri: http://localhost:8091  # Le service de notification écoute sur ce port
          predicates:
            - Path=/ws/**  # Route WebSocket
          filters:
            - StripPrefix=1  # Supprime "/annonce" avant de rediriger

        - id: service-b
          uri: http://localhost:8082
          predicates:
            - Path=/apir/**
          filters:
            - name: AddRequestHeader
              args:
                name: X-Request-Foo
                value: Bar

      discovery:
        locator:
          enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/malek
          jwk-set-uri: http://localhost:8180/realms/malek/protocol/openid-connect/certs


eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.springframework.cloud.gateway: DEBUG